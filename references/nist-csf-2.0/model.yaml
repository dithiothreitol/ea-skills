# NIST Cybersecurity Framework 2.0 -- Functions and Categories.
#
# Public domain (a work of the U.S. federal government); see NOTICE.md for the
# citation. Transcribed at the *structural* level only: the six Functions and the
# twenty-two Categories, with their published identifiers. Subcategories are not
# included -- they are the level at which control implementation is argued, and a
# taxonomy this tooling only measures coverage against does not need them. Add them
# locally if your organisation maps at that grain, and re-pin (`pin-reference`).
#
# Descriptions are deliberately absent: the Framework's own wording is the normative
# text, and a paraphrase sitting in a YAML file is the kind of thing that gets quoted
# back as if it were the standard.

name: NIST Cybersecurity Framework 2.0
version: "2.0"
source: NIST CSWP 29 (February 2024), Functions and Categories

