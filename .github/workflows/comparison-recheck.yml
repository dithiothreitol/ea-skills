# The README's capability comparison carries a standing obligation: re-check it quarterly
# and correct any claim that stopped being true. (Monthly until 2026-10: two reminders went
# unanswered in a row, and an obligation that is routinely missed teaches people to ignore
# the reminder -- a cadence somebody keeps beats a stricter one nobody does.) No test can
# check a competitor's changelog -- but the *reminder* is automatable, and an obligation
# nobody is reminded of is the exact failure mode this project criticises in other tools.
name: Comparison re-check

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *" # 09:00 UTC on the first day of each quarter
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open the quarterly re-check issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Comparison table re-check — $(date -u +'%Y')-Q$(( ($(date -u +%-m) + 2) / 3 ))" \
            --label "documentation" \
            --body "$(cat <<'BODY'
          The **How it compares** table in [README.md](../blob/main/README.md#how-it-compares)
          states claims about five neighbouring projects, dated against the 2026-07-29
          competitive survey behind `docs/BLUEPRINT.md`. Neighbours move fast; a stale
          comparison is the kind of unbacked claim this repository refuses elsewhere.

          Check each project's changelog/releases since the last re-check and correct any
          row that stopped being true. Then update the date line under the table.

          - [ ] mcp-archimate
          - [ ] 7bots / archimate-deep-agent
          - [ ] Transitrix
          - [ ] ArcKit
          - [ ] Ardoq
          - [ ] ea-skills column still accurate (rules, skills, capabilities)
          - [ ] date line under the table updated

          Nothing to change is a valid outcome — say so and close: the point is that the
          check happened, not that the table moved.
          BODY
          )"
