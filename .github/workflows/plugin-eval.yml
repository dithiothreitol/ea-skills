# Host behaviour, measured: `claude plugin eval` runs each case in evals/ as a real
# Claude Code session with only this plugin loaded, and again with no plugin, and reports
# the delta. It complements eval/harness/ (which measures the skill *prose* against gold
# by scripting the loop) -- this one lets a real host plan, route and use its tools.
#
# Never part of the push gate, for the harness's reasons: it costs tokens and it is not
# deterministic. Dispatch it deliberately; it also runs monthly on its own, and without an
# ANTHROPIC_API_KEY repository secret the scheduled run says so and does nothing else.
# Linux only: shell-granting runs need the OS sandbox, which native Windows does not have
# (bubblewrap + socat provide it here).
name: Evaluate the plugin on a real host

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per arm (the spread is the point)"
        required: false
        default: "3"
      model:
        description: "Model for the agent under test"
        required: false
        default: "claude-sonnet-5-5"
      threshold:
        description: "Exit 1 if any case scores below this (0..1)"
        required: false
        default: "0.67"
      max_cost_usd:
        description: "Hard cost ceiling for the whole run"
        required: false
        default: "20"
  schedule:
    - cron: "0 7 1 * *"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      RUNS: ${{ github.event.inputs.runs || '3' }}
      MODEL: ${{ github.event.inputs.model || 'claude-sonnet-5-5' }}
      THRESHOLD: ${{ github.event.inputs.threshold || '0.67' }}
      MAX_COST: ${{ github.event.inputs.max_cost_usd || '20' }}
    steps:
      - name: No key, no measurement
        if: env.HAS_KEY != 'true'
        run: echo "::notice::the repository holds no ANTHROPIC_API_KEY secret, so nothing was measured (docs/SKILL-COVERAGE.md)"

      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-python@v7
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"

      - name: Install the runtime dependencies `easkills` needs
        if: env.HAS_KEY == 'true'
        run: python -m pip install --require-hashes -r constraints.txt

      - name: Install the sandbox backend and Claude Code
        if: env.HAS_KEY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          npm install -g @anthropic-ai/claude-code

      # --scaffold runs the cases' own scaffold scripts, which copy committed golden cases
      # into each run's workspace; they are this repository's code, reviewed like any other.
      # The grants are the narrowest that let the skills do their job: file writes, and the
      # deterministic CLI. Nothing that reaches the network is granted.
      - name: Run the eval suite
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --runs "$RUNS" \
            --model "$MODEL" \
            --threshold "$THRESHOLD" \
            --max-cost-usd "$MAX_COST" \
            --no-publish \
            --keep-temp \
            --allow-tools Write Edit "Bash(easkills *)" "Bash(python -m easkills *)" \
            --json plugin-eval.json

      # Uploaded rather than committed: a number from a non-deterministic run becomes a
      # documented result only when a human has read it. The traces are kept (--keep-temp)
      # because the first run's numbers could not be explained without them.
      - name: Keep the results
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-eval-results
          path: |
            plugin-eval.json
            evals/results/
            /tmp/claude-eval-*/out/trace.jsonl
          if-no-files-found: ignore
