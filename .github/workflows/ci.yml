name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Oracle integrity
        run: python -m easkills oracle-info

      - name: Tests
        run: python -m pytest tests -q

      # The worked example is part of the contract: it must stay clean, warnings
      # included, or the documented "0 errors, 0 warnings" claim is stale.
      - name: Validate worked example (strict)
        run: python -m easkills validate --root eval/example --strict

      - name: Validate worked example fact register (strict)
        run: python -m easkills validate-facts --root eval/example --strict

      # Governance gate. Note: the example's dispensation expires 2027-06-30; this
      # step failing after that date is the mechanism working -- renew or close the
      # record, do not weaken the gate.
      - name: Validate worked example governance log (strict)
        run: python -m easkills validate-gov --root eval/example --strict

      # The example's sources are documented as 100% cited by the fact register.
      - name: Fact coverage of the worked example
        run: python -m easkills coverage --root eval/example --min-coverage 100 --strict

      - name: Compile worked example
        run: python -m easkills compile --root eval/example

      # The generated architecture description and SVG views are committed; a change
      # to the model or the generators without regeneration must fail here.
      - name: Generated documentation must be fresh
        run: |
          python -m easkills docs --root eval/example
          git diff --exit-code eval/example/docs

      # Gold that does not pass its own gates is not gold, and the scorer must
      # report a perfect self-score or its matching logic has drifted.
      - name: Golden set stays gold
        run: |
          python -m easkills validate --root eval/golden/clinic --strict
          python -m easkills validate-facts --root eval/golden/clinic --strict
          python -m easkills score --root eval/golden/clinic --gold eval/golden/clinic --min-f1 100
          python -m easkills score --root eval/example --gold eval/example --min-f1 100

      # The negative fixture must keep failing. A green run here would mean the
      # validator has stopped catching things.
      - name: Negative fixture must fail
        run: |
          if python -m easkills validate --root eval/fixtures/broken; then
            echo "::error::the broken fixture validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Negative fact-register fixture must fail
        run: |
          if python -m easkills validate-facts --root eval/fixtures/broken; then
            echo "::error::the broken fact register validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Negative governance fixture must fail
        run: |
          if python -m easkills validate-gov --root eval/fixtures/broken; then
            echo "::error::the broken governance log validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Upload exchange file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archimate-exchange-file
          path: eval/example/build/model.xml
          if-no-files-found: ignore
