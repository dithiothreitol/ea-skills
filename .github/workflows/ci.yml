name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every step below is POSIX shell, including on the Windows runners, so the gate reads
# the same everywhere.
defaults:
  run:
    shell: bash

jobs:
  # The metadata promises Python 3.11+ and OS independence; this job is what makes
  # those claims true. Windows matters twice over: it is the development platform, and
  # line-ending conversion of the vendored oracle would break the SHA-256 pins
  # (see .gitattributes) -- `oracle-info` here is that canary.
  suite:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Oracle integrity
        run: python -m easkills oracle-info

      - name: Tests
        run: python -m pytest tests -q

  # The artifact gates run once: they check repository content, not the interpreter.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The worked example is part of the contract: it must stay clean, warnings
      # included, or the documented "0 errors, 0 warnings" claim is stale.
      - name: Validate worked example (strict)
        run: python -m easkills validate --root eval/example --strict

      - name: Validate worked example fact register (strict)
        run: python -m easkills validate-facts --root eval/example --strict

      # Governance gate. Note: the example's dispensation expires 2027-06-30; this
      # step failing after that date is the mechanism working -- renew or close the
      # record, do not weaken the gate.
      - name: Validate worked example governance log (strict)
        run: python -m easkills validate-gov --root eval/example --strict

      # The example's sources are documented as 100% cited by the fact register.
      - name: Fact coverage of the worked example
        run: python -m easkills coverage --root eval/example --min-coverage 100

      # The per-layer definition of done. Zero open checkpoints under --strict is a
      # claim the example makes: every layer it models, it finishes.
      - name: Layer readiness of the worked example (strict)
        run: python -m easkills readiness --root eval/example --strict

      # The example ships a reference pack (authored for it -- no licensed content in
      # this repository). Zero findings under --strict means every node of the taxonomy
      # is either answered by the model or excluded by a recorded decision.
      - name: Reference alignment of the worked example (strict)
        run: python -m easkills align --root eval/example --strict

      # The worked example is deliberately out of DORA scope (a food wholesaler), so the
      # regulatory gate runs on its own fixture. Clean means: no error, no warning, and
      # the REG003 the fixture carries on purpose -- a waiver on a critical service is
      # exposure to disclose, not a defect to fix.
      - name: DORA register of the regulated fixture (strict)
        run: python -m easkills dora-register --root eval/fixtures/finco --as-of 2026-07-30 --strict

      # No `propose` step here on purpose. It exits 0 whether or not it proposes
      # anything -- a generator that failed on "there is work to do" would be unusable --
      # so a CI step running it could not fail, and a gate that cannot fail is worse than
      # no gate: it reads as coverage. The claim "the example has nothing to propose" is
      # already gated by `align --strict`, `readiness --strict` and the overlap-free
      # assertion in tests/test_reports.py, and asserted per source in tests/test_propose.py.

      - name: Compile worked example
        run: python -m easkills compile --root eval/example

      # The generated architecture description and SVG views are committed; a change
      # to the model or the generators without regeneration must fail here.
      - name: Generated documentation must be fresh
        run: |
          python -m easkills docs --root eval/example
          git diff --exit-code eval/example/docs

      # The checklist is only worth having if it is gated. Pinned to a date because
      # the example's dispensation expires in 2027 on purpose: that failure belongs to
      # the maintenance rehearsal, not to a CI run that happens to be late.
      - name: ISO 42010 Clause 6 stays conformant on the worked example
        run: python -m easkills conformance --root eval/example --strict --as-of 2026-07-30

      # Gold that does not pass its own gates is not gold, and the scorer must
      # report a perfect self-score or its matching logic has drifted.
      - name: Golden set stays gold
        run: |
          python -m easkills validate --root eval/golden/clinic --strict
          python -m easkills validate-facts --root eval/golden/clinic --strict
          python -m easkills score --root eval/golden/clinic --gold eval/golden/clinic --min-f1 100
          python -m easkills validate --root eval/golden/contested --strict
          python -m easkills validate-facts --root eval/golden/contested --strict
          python -m easkills coverage --root eval/golden/contested --min-coverage 100
          python -m easkills score --root eval/golden/contested --gold eval/golden/contested --min-f1 100
          python -m easkills score --root eval/example --gold eval/example --min-f1 100

      # ea-check runs in a *consuming* repository (AD-09): the clean fixture must pass
      # under --strict, and the negative one must fail -- otherwise the compliance lint
      # is decoration in someone else's CI.
      - name: Consuming-repository check
        run: |
          python -m easkills check --root eval/example --repo eval/fixtures/consumer-clean --scope app-order-portal --as-of 2026-07-30 --strict
          if python -m easkills check --root eval/example --repo eval/fixtures/consumer --scope app-order-portal --as-of 2026-07-30; then
            echo "::error::the negative consumer fixture passed -- ea-check is not catching violations"
            exit 1
          fi

      # The negative fixture must keep failing. A green run here would mean the
      # validator has stopped catching things.
      - name: Negative fixture must fail
        run: |
          if python -m easkills validate --root eval/fixtures/broken; then
            echo "::error::the broken fixture validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Negative fact-register fixture must fail
        run: |
          if python -m easkills validate-facts --root eval/fixtures/broken; then
            echo "::error::the broken fact register validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Negative governance fixture must fail
        run: |
          if python -m easkills validate-gov --root eval/fixtures/broken; then
            echo "::error::the broken governance log validated cleanly -- the validator is not catching violations"
            exit 1
          fi

      - name: Negative reference fixture must fail
        run: |
          if python -m easkills align --root eval/fixtures/broken; then
            echo "::error::the broken reference packs aligned cleanly -- align is not catching violations"
            exit 1
          fi

      # A register generator that never refuses is a rubber stamp.
      - name: Negative regulatory fixture must fail
        run: |
          if python -m easkills dora-register --root eval/fixtures/finco-broken --as-of 2026-07-30; then
            echo "::error::the broken DORA fixture registered cleanly -- the REG rules are not catching violations"
            exit 1
          fi

      # The packaging metadata claims an editable install works (there is no wheel by
      # design -- the oracle and schemas are repository data). Prove the claim. Last,
      # so it cannot influence the gates above.
      - name: Editable install
        run: |
          python -m pip install -e .
          python -c "import easkills.cli; print('editable install OK')"
          python -m easkills oracle-info

      - name: Upload exchange file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archimate-exchange-file
          path: eval/example/build/model.xml
          if-no-files-found: ignore
