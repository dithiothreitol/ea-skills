# The architecture gates, run by CI rather than remembered by people.
#
# On every push and pull request: the model, evidence and governance gates, and the
# generated documentation must be fresh. Every night: the date-dependent rules against
# today's date -- an expired dispensation (DISP003), a retired standard its waiver no
# longer covers (STD002), an SLA breached -- with one issue opened or updated when they
# fail, because a failing nightly job nobody is told about is the silent expiry again.
#
# The tooling comes from the composite action at a pinned release (`easkills init` wrote
# the one that scaffolded this repository); its dependencies install with their hashes.
# Add --strict to a gate once the repository claims zero warnings there.
name: Architecture gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `diff --ref` reads the base branch from history

      - uses: dithiothreitol/ea-skills@v0.22.0

      - name: Model gate (includes the approval seal, APR001-APR003)
        run: easkills validate --root .

      - name: Evidence gate
        run: easkills validate-facts --root .

      - name: Governance gate
        run: easkills validate-gov --root .

      - name: Generated documentation is committed and fresh
        run: |
          easkills docs --root .
          if [ -n "$(git status --porcelain docs/)" ]; then
            git status --porcelain docs/
            echo "::error::docs/ is stale -- run 'easkills docs --root .' and commit the result"
            exit 1
          fi

      - name: What this pull request changes in the model
        if: github.event_name == 'pull_request'
        run: easkills diff --root . --ref "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: dithiothreitol/ea-skills@v0.22.0

      - name: Date-dependent gates against today
        id: dated
        run: |
          set +e
          easkills validate-gov --root . > nightly.txt 2>&1; governance=$?
          echo >> nightly.txt
          easkills validate --root . >> nightly.txt 2>&1; model=$?
          echo >> nightly.txt
          easkills staleness --root . >> nightly.txt 2>&1
          cat nightly.txt
          if [ $governance -ne 0 ] || [ $model -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update one issue when they fail
        if: steps.dated.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly architecture gates are failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'The nightly run %s failed.\n\n```\n%s\n```\n' "$run_url" "$(tail -c 60000 nightly.txt)")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
