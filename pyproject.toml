[project]
name = "ea-skills"
version = "0.6.0"
description = "The enterprise-architecture lifecycle as agent skills over a deterministic core: unstructured input to validated ArchiMate 3.2, generated views, ISO 42010 documentation and living governance, in git."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dariusz Tyszka" }]
keywords = [
    "enterprise-architecture",
    "archimate",
    "togaf",
    "iso-42010",
    "architecture-as-code",
    "governance",
    "ai-agents",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20", "lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/dithiothreitol/ea-skills"
Documentation = "https://github.com/dithiothreitol/ea-skills/blob/main/docs/GETTING-STARTED.md"
Changelog = "https://github.com/dithiothreitol/ea-skills/blob/main/CHANGELOG.md"
Issues = "https://github.com/dithiothreitol/ea-skills/issues"

[project.scripts]
easkills = "easkills.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["easkills"]
