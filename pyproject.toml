# ea-skills is used from a clone: `python -m easkills <command>`.
#
# The oracle (`oracle/`) and the generated schemas (`schema/`) are repository data that
# live outside the package directory by design -- they are hash-pinned, reviewed content
# that the whole gate story depends on. A wheel would therefore ship a package that
# cannot validate anything, so this project is deliberately not published, has no
# console-script entry point and no PyPI long description. The metadata below exists for
# dependency resolution and editable installs (`pip install -e .`), nothing more.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-skills"
version = "0.9.0"
description = "The enterprise-architecture lifecycle as agent skills over a deterministic core: unstructured input to validated ArchiMate 3.2, generated views, ISO 42010 documentation and living governance, in git."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dariusz Tyszka" }]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20", "lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/dithiothreitol/ea-skills"
Documentation = "https://github.com/dithiothreitol/ea-skills/blob/main/docs/GETTING-STARTED.md"
Changelog = "https://github.com/dithiothreitol/ea-skills/blob/main/CHANGELOG.md"
Issues = "https://github.com/dithiothreitol/ea-skills/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["easkills"]
