# Model repository configuration.
name: Aurora Foods Enterprise Architecture
documentation: >
  Worked example shipped with the ea-skills repository. Aurora Foods is fictional;
  the model exists to exercise the validator and compiler end to end, and to show
  what evidence-backed modelling looks like in practice.

# Elements not reviewed within this many days raise a staleness warning (GOV004).
stalenessDays: 365

# Minimum similarity before a provenance quote counts as an approximate match (PROV004).
quoteMatchThreshold: 0.90

# Provenance file references resolve against this directory.
factsRoot: .

# Raw source documents that ea-intake ingests (chunking, coverage, SRC001).
sourcesDir: facts/sources

# Optional. Unit rates that turn the debt register's exposure into money.
#
# The tool computes the exposure; the operator prices it. Nothing here is derived,
# benchmarked or defaulted -- these are Aurora Foods' own numbers, and the ones below are
# illustrative because Aurora Foods is fictional. Delete this block and `debt` prints
# exposure only, exactly as it did before the cost model existed.
#
# Set only the rates you can defend. An exposure with no rate is reported as *not
# priced*, next to the total, every time -- which is the honest way to say "we did not
# put a number on this" and is far better than a plausible guess nobody can source.
costModel:
  currency: EUR
  # Carrying cost of content nobody has re-read: the review effort deferred, per element
  # per day past the 365-day threshold above.
  staleElementDay: 1.5
  # What an open exception costs while it stays open -- the reason waivers expire.
  openDispensationDay: 12
  # Per element still built on a deprecated or retired standard: the migration it owes.
  eolElement: 4000
