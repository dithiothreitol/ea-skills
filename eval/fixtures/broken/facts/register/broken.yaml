# Each entry below is annotated with the rule code it is meant to trigger.

facts:
  # --- FACT002: same fact id twice ----------------------------------------------------
  - id: fact-dup
    statement: The primary data centre hosts two application servers.
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers
  - id: fact-dup
    statement: Something else entirely, but the id is already taken.
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- FACT001: schema violation (wrong field name, required 'statement' missing) -----
  - id: fact-schema-violation
    claim: this field does not exist in the schema
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- FACT003: the cited source does not exist ---------------------------------------
  - id: fact-missing-source
    statement: Cites a source document that does not exist.
    provenance:
      - file: facts/sources/does-not-exist.md
        quote: any quote at all goes here

  # --- FACT008: the evidence file is outside the repository ---------------------------
  - id: fact-escaping-source
    statement: Cites a file outside the repository as its evidence.
    provenance:
      - file: ../../../outside-the-repository.md
        quote: any quote at all goes here

  # --- FACT009: contested, but the contradiction is not followable --------------------
  - id: fact-contested-orphan
    statement: The primary data centre is scheduled to close, according to somebody.
    confidence: contested
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers
    entities: [entity-dup]

  # --- FACT010: contests a fact that is not in the register ---------------------------
  - id: fact-contests-ghost
    statement: Order records are held somewhere other than the finance system.
    confidence: contested
    contests: [fact-that-was-never-written]
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system
    entities: [entity-dup]

  # --- FACT011: one-sided contradiction; the other fact does not point back ------------
  - id: fact-contests-one-way
    statement: The finance system does not hold order records at all.
    confidence: contested
    contests: [fact-dup]
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system
    entities: [entity-dup]

  # --- FACT004: the quote does not occur in the cited source --------------------------
  - id: fact-fabricated-quote
    statement: The board approved four million euro for the programme.
    provenance:
      - file: facts/sources/notes.md
        quote: the board approved a budget of four million euro for this programme

  # --- FACT005: quote is close but not verbatim ("center" vs "centre") ----------------
  - id: fact-paraphrased-quote
    statement: Two mirrored application servers run in the primary data centre.
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data center hosts two application servers

  # --- FACT006: references an entity that is not in the table -------------------------
  # Also RDY010 (readiness): the `strategy` topic says the register covers the Strategy
  # layer, while the approved model holds no Strategy element -- evidence gathered and
  # never modelled, which is the one kind of incompleteness the sources can prove.
  - id: fact-unknown-entity
    statement: Order records are held by the finance system.
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system
    entities: [no-such-entity]
    topics: [strategy]

  # --- FACT007: duplicates the statement of fact-unknown-entity -----------------------
  - id: fact-zz-duplicate-statement
    statement: Order records are held by the finance system.
    provenance:
      - file: facts/sources/notes.md
        quote: referenced by the customer portal
