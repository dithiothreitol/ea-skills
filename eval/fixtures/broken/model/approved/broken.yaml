# Each entry below is annotated with the rule code it is meant to trigger.

elements:
  # --- well-formed anchors, used as endpoints for the relationship tests -------------
  - id: node-a
    type: Node
    name: Application Server A
    owner: infra@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  - id: node-b
    type: Node
    name: Application Server B
    owner: infra@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: two application servers that mirror each other

  - id: app-finance
    type: ApplicationComponent
    name: Finance System
    owner: finance@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  - id: data-order
    type: DataObject
    name: Order Record
    owner: finance@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: referenced by the customer portal

  - id: actor-customer
    type: BusinessActor
    name: Customer
    owner: sales@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: referenced by the customer portal

  - id: process-invoicing
    type: BusinessProcess
    name: Issue Invoice
    owner: finance@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- NAME004: two elements of the same type sharing a name ------------------------
  - id: dup-name-first
    type: ApplicationInterface
    name: Shared Name
    owner: it@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers
  - id: dup-name-second
    type: ApplicationInterface
    name: Shared Name
    owner: it@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- GOV001 + GOV002: no owner, no review date, in the approved zone --------------
  - id: unowned
    type: BusinessRole
    name: Unowned Role
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- GOV004: reviewed long before the 30-day threshold in ea.config.yaml ----------
  - id: stale
    type: BusinessRole
    name: Stale Role
    owner: someone@example.test
    lastReviewed: 2020-01-01
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- GOV003: unparseable review date ----------------------------------------------
  - id: bad-date
    type: BusinessRole
    name: Bad Date Role
    owner: someone@example.test
    lastReviewed: "2026-13-45"
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- PROV003: the quote does not occur in the cited source -------------------------
  - id: fabricated-quote
    type: BusinessRole
    name: Fabricated Citation Role
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: the board approved a budget of four million euro for this programme

  # --- PROV004: quote is close but not verbatim ("center" vs "centre") ---------------
  - id: paraphrased-quote
    type: BusinessRole
    name: Paraphrased Citation Role
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data center hosts two application servers

  # --- PROV002: the cited source does not exist -------------------------------------
  - id: missing-source
    type: BusinessRole
    name: Missing Source Role
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/does-not-exist.md
        quote: any quote at all goes here

  # --- PROV008: the citation escapes the repository ----------------------------------
  # A quote "verified" against a file outside the repository is traceability nobody can
  # review -- and in CI on untrusted content, a probe of the runner's filesystem.
  - id: escaping-source
    type: BusinessRole
    name: Role Citing Outside the Repository
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: ../../../outside-the-repository.md
        quote: any quote at all goes here

  # --- PROV001: no provenance and not declared as an assumption ----------------------
  - id: unsourced
    type: BusinessRole
    name: Unsourced Role
    owner: someone@example.test
    lastReviewed: 2026-07-20

  # --- PROV005: assumed but no rationale --------------------------------------------
  - id: assumed-without-rationale
    type: BusinessRole
    name: Assumed Role
    owner: someone@example.test
    lastReviewed: 2026-07-20
    assumed: true

  # --- SMELL001 + NAME001: isolated element with a placeholder name ------------------
  - id: orphan
    type: Facility
    name: TBD Distribution Centre
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- SCHEMA001: not an ArchiMate concept ------------------------------------------
  - id: bogus-type
    type: Microservice
    name: Bogus Type
    owner: someone@example.test
    lastReviewed: 2026-07-20
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- PROV007: provenance references a fact that is not in the register -------------
  - id: fact-ref-missing
    type: Requirement
    name: Requirement Citing a Missing Fact
    owner: someone@example.test
    lastReviewed: 2026-07-20
    appliesTo: [app-finance]
    provenance:
      - fact: no-such-fact

  # --- MOT001: appliesTo target does not exist ---------------------------------------
  - id: motivation-dangling-applies
    type: Constraint
    name: Constraint Binding Nothing Real
    owner: someone@example.test
    lastReviewed: 2026-07-20
    appliesTo: [no-such-element]
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- STD001: references a standard that is not in the SIB ---------------------------
  - id: std-ref-unknown
    type: Node
    name: Node With Unknown Standard
    owner: someone@example.test
    lastReviewed: 2026-07-20
    standards: [no-such-standard]
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- STD002: references a retired standard, no dispensation covers it ---------------
  - id: std-ref-retired
    type: Node
    name: Node On Retired Standard
    owner: someone@example.test
    lastReviewed: 2026-07-20
    standards: [std-dead]
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- STD003: references a deprecated standard ---------------------------------------
  - id: std-ref-deprecated
    type: Node
    name: Node On Deprecated Standard
    owner: someone@example.test
    lastReviewed: 2026-07-20
    standards: [std-old]
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- MOT002: appliesTo on an element outside the Motivation layer -------------------
  - id: applies-on-wrong-layer
    type: ApplicationComponent
    name: Component With An Applicability Selector
    owner: someone@example.test
    lastReviewed: 2026-07-20
    appliesTo: [node-a]
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

relationships:
  # --- REL001: DataObject -> BusinessActor permits Association only ------------------
  - id: rel-illegal
    type: Serving
    source: data-order
    target: actor-customer
    provenance:
      - file: facts/sources/notes.md
        quote: referenced by the customer portal

  # --- REL001 with swapped-endpoint hint: Realization is legal the other way round ---
  - id: rel-swapped
    type: Realization
    source: process-invoicing
    target: app-finance
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

  # --- REL002: composition cycle ----------------------------------------------------
  - id: rel-cycle-ab
    type: Composition
    source: node-a
    target: node-b
    provenance:
      - file: facts/sources/notes.md
        quote: two application servers that mirror each other
  - id: rel-cycle-ba
    type: Composition
    source: node-b
    target: node-a
    provenance:
      - file: facts/sources/notes.md
        quote: two application servers that mirror each other

  # --- REF001: endpoint that does not exist -----------------------------------------
  - id: rel-dangling
    type: Association
    source: node-a
    target: no-such-element
    provenance:
      - file: facts/sources/notes.md
        quote: The primary data centre hosts two application servers

  # --- REL003: same type, same endpoints, twice -------------------------------------
  - id: rel-duplicate-one
    type: Association
    source: app-finance
    target: actor-customer
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system
  - id: rel-duplicate-two
    type: Association
    source: app-finance
    target: actor-customer
    provenance:
      - file: facts/sources/notes.md
        quote: Order records are held by the finance system

views:
  # --- REF002: view refers to an element that is not in the model --------------------
  # --- ISO005: frames no declared concern (concerns exist in this repository) --------
  - id: view-bad-reference
    name: Broken View
    include:
      - node-a
      - no-such-element

  # --- REF003: view with nothing on it ----------------------------------------------
  - id: view-empty
    name: Empty View
    include: []

  # --- ISO001: frames a concern that is not declared ---------------------------------
  - id: view-unknown-concern
    name: View With Unknown Concern
    concerns: [no-such-concern]
    include:
      - node-a

stakeholders:
  # --- ISO002: holds a concern that is not declared ----------------------------------
  - id: stakeholder-bad-concern
    name: Stakeholder With Unknown Concern
    concerns: [no-such-concern]

  # --- ISO004: holds no concerns ------------------------------------------------------
  - id: stakeholder-empty
    name: Stakeholder With Nothing To Say

concerns:
  # --- ISO003 + ISO006: framed by no view, held by no stakeholder ---------------------
  - id: concern-orphan
    statement: Does anything address or own this concern at all?
