# Negative fixture: every concept in this repository is wrong on purpose.
# The test suite asserts that each documented rule code actually fires here.
name: Broken Fixture Model
documentation: Deliberately invalid model used to test the validator.
stalenessDays: 30
# --- SCHEMA002: a ratio written as a percentage. Out of range, so the documented
# default (0.90) is applied and the run continues -- but the typo is an error, because
# a silently mis-set threshold decides whether fabricated quotes pass.
quoteMatchThreshold: 90
factsRoot: .
# --- SCHEMA002: a rate key this tool does not know how to apply. Unknown keys are errors
# in ea.config.yaml, unlike an element's open property map -- a model's own property keys
# are the organisation's business, but a misspelled *rate* silently prices nothing while
# the total still reads like a total. The exposure it was meant to price is reported as
# "not priced" beside that total, which is the second half of the same guarantee.
costModel:
  currency: EUR
  staleElementDay: 2
  eolElemnt: 4000
