# Which AI system serves which business function. The mail-triage classifier has no
# relationship on purpose: the clean inventory carries a real "functions supported"
# gap row without any rule firing, which is the difference between a gap and a defect.

relationships:
  - id: rel-scoring-serves-loan-decision
    type: Serving
    source: app-credit-scoring
    target: process-loan-decision
    assumed: true
    rationale: Fixture content authored for the AIR rules, not extracted from a source.

  # Realization, not Serving: the 3.2 matrix permits only Association and Realization from
  # an ApplicationComponent to a Capability. This edge was Serving until 0.19.0 -- REL001 on
  # a fixture nothing validated, found when `propose --from ai-act` ran the gate over it.
  - id: rel-chatbot-realizes-customer-service
    type: Realization
    source: app-support-chatbot
    target: cap-customer-service
    assumed: true
    rationale: Fixture content authored for the AIR rules, not extracted from a source.
